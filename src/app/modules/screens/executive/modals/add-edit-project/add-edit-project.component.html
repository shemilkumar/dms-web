<app-custom-modal [data]="modalData" (onCancel)="dialogRef.close()" (onClose)="dialogRef.close()" (onSubmit)="submit()"
  [loading]="isLoading" [isFormValid]="form.valid">

  <form [formGroup]="form" class="form">

    <div class="form__grid !gap-y-8">

      <div class="form__input">
        <label for="name" class="form__label">
          Project Name <span class="form__label--required">*</span>
        </label>
        <input type="text" id="name" formControlName="name">
      </div>

      <div class="form__input">
        <label for="clientName" class="form__label">
          Client Name <span class="form__label--required">*</span>
        </label>
        <input type="text" id="clientName" formControlName="clientName">
      </div>

      <div class="form__input">
        <label for="startDate" class="form__label">
          Start Date <span class="form__label--required">*</span>
        </label>
        <input type="text" id="startDate" formControlName="startDate" [disabled]="data?.startDate"
          [readOnly]="data?.startDate">
      </div>

      <div class="form__input">
        <label for="endDate" class="form__label">
          End Date <span class="form__label--required">*</span>
        </label>
        <input type="text" id="endDate" formControlName="endDate" [disabled]="data?.endDate" [readOnly]="data?.endDate">
      </div>

      <textarea id="description" formControlName="clientName" name="description" rows="3"
        style="resize: none;border: 1px solid #ccc;width: 100%;border-radius: 5px;"></textarea>
    </div>
  </form>

</app-custom-modal>
