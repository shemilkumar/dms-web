<div class="mt-6 px-12" *ngIf="projects$ | async as projects">
  <!-- Header -->
  <div class="flex flex-col gap-1">
    <div class="flex items-center justify-between">
      <span class="text-5xl py-2 text-green-900">
        Projects
      </span>

      <app-button label="New Projects" type="add" (onClick)="createProject()" />
    </div>
    <p class="text-sm text-gray-500 mt-1 font-semibold">
      {{ projects?.length || 0 }} projects
    </p>
  </div>

  <div class="flex gap-4 w-fit">
    <app-search-box (onChange)="fetchProjects($event)" id="searchProjects" placeholder="Search projects..." />

    <mat-select placeholder="Select Status" (selectionChange)="statusChange($event)" [(ngModel)]="selectedStatus">
      <mat-option value="ALL">All</mat-option>
      <mat-option value="ACTIVE">Active</mat-option>
      <mat-option value="DRAFT">Draft</mat-option>
      <mat-option value="CLOSED">Closed</mat-option>
    </mat-select>
  </div>

  <!-- Cards grid -->
  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4 mt-8  border-red-500 max-h-[600px] overflow-y-auto">

    <!-- Project cards -->
    <div *ngFor="let project of projects" class="group relative overflow-hidden rounded-2xl
             border border-slate-200/80
             bg-gradient-to-b from-white/95 to-white/70
             backdrop-blur-md
             shadow-[0_12px_35px_rgba(15,23,42,0.10)]
             hover:shadow-[0_18px_55px_rgba(15,23,42,0.18)]
             hover:-translate-y-1 transition-all cursor-pointer" [ngClass]="{
    'border-slate-200/80 shadow-[0_12px_35px_rgba(15,23,42,0.10)] hover:-translate-y-1 hover:shadow-[0_18px_55px_rgba(15,23,42,0.18)] cursor-pointer': project.status !== 'CLOSED',
    'border-slate-200 bg-slate-50/60  opacity-75': project.status === 'CLOSED'
  }" (click)="goToBOM(project)">

      <button *ngIf="project.status === 'ACTIVE'" class="absolute top-3 right-3 z-20
           px-2.5 py-1 rounded-full
           text-[11px] font-semibold
           bg-rose-50/90 text-rose-700
           border border-rose-200
           opacity-100
           translate-y-[-4px] group-hover:translate-y-0
           transition-all duration-150
           hover:bg-rose-100 hover:border-rose-300"
        (click)="changeProjectStatus(project, 'CLOSED'); $event.stopPropagation()" matTooltip="Close this project"
        matTooltipPosition="below">
        ✕ Close
      </button>

      <button *ngIf="project.status === 'CLOSED'" class="absolute top-3 right-3 z-20
         px-2.5 py-1 rounded-full
         text-[11px] font-semibold
         bg-emerald-50/90 text-emerald-700
         border border-emerald-200
         opacity-100
         translate-y-[-4px] group-hover:translate-y-0
         transition-all duration-150
         hover:bg-emerald-100 hover:border-emerald-300"
        (click)="changeProjectStatus(project, 'ACTIVE'); $event.stopPropagation()" matTooltip="Re-open this project"
        matTooltipPosition="below">
        ↺ Re-open
      </button>


      <!-- Content wrapper -->
      <div class="relative z-10 p-4">
        <!-- Status + short id with top divider -->
        <div class="mb-3 pb-2 flex items-center justify-between border-b border-slate-100/80">
          <div class="flex items-center gap-2">
            <!-- Status dot -->
            <span class="h-2.5 w-2.5 rounded-full" [ngClass]="{
                'bg-green-500': project.status === 'ACTIVE',
                'bg-yellow-400': project.status === 'DRAFT',
                'bg-rose-500': project.status === 'CLOSED'
              }"></span>

            <span class="text-xs font-semibold text-gray-600">
              {{ project.status | titlecase }}
            </span>
          </div>

          <!-- <span class="text-[11px] font-medium text-gray-400" [matTooltip]="project.projectId"
            matTooltipPosition="below">
            {{ shortId(project.projectId) }}
          </span> -->
        </div>

        <!-- Name -->
        <h2 class="mb-2 line-clamp-2 text-base font-semibold
                 text-slate-900 group-hover:text-slate-950">
          {{ project.projectName }}
        </h2>

        <!-- Meta -->
        <p class="text-xs font-semibold
                 text-gray-500 group-hover:text-gray-600">
          • Created {{ project.createdAt || '21 Nov 2025' }}
        </p>

        <!-- Footer: open + edit/delete -->
        <div class="mt-4 flex items-center justify-between">
          <button class="text-sm font-medium text-[#008000]
                   hover:text-green-700 underline-offset-4 hover:underline"
            (click)="goToBOM(project); $event.stopPropagation()">
            Open project →
          </button>

          <div class="flex-shrink-0 flex items-center gap-2" *ngIf="project.status !== 'CLOSED'">
            <img src="assets/icons/edit.svg" alt="Edit"
              class="icon icon__small cursor-pointer hover:scale-125 transition-transform"
              (click)="updateProject(project); $event.stopPropagation()">
            <img src="assets/icons/delete.svg" alt="Delete"
              class="icon icon__small cursor-pointer hover:scale-125 transition-transform"
              (click)="deleteProject(project); $event.stopPropagation()">
          </div>
        </div>
      </div>

      <!-- Ambient glow behind card -->
      <div class="pointer-events-none absolute inset-0 rounded-2xl opacity-0
               bg-[radial-gradient(circle_at_20%_0%,rgba(0,128,0,0.10),transparent_55%)]
               transition-opacity duration-200 group-hover:opacity-100">
      </div>
    </div>

    <!-- + Add Project card -->
    <div class="flex flex-col items-center justify-center rounded-2xl
             border-2 border-dashed border-green-300/80
             bg-white/60 hover:bg-white
             hover:border-green-500
             text-center p-4 min-h-[180px]
             cursor-pointer transition-all
             shadow-[0_6px_20px_rgba(15,23,42,0.05)]
             hover:shadow-[0_10px_30px_rgba(15,23,42,0.12)]" (click)="createProject()">
      <div class="flex h-12 w-12 items-center justify-center rounded-full
               bg-green-50 text-[#008000] mb-3
               border border-green-200">
        <span class="text-3xl leading-none">+</span>
      </div>
      <div class="text-sm font-semibold text-gray-800">
        Create new project
      </div>
      <p class="mt-1 text-xs text-gray-500 px-4">
        Start a fresh project to manage inventory and workflows.
      </p>
    </div>

  </div>

  <!-- EMPTY -->
  <!-- <div *ngIf="projects?.length === 0" class="border-dashed flex justify-center items-center flex-col
           border-2 border-gray-200 rounded-lg p-8 text-center text-gray-500 mt-8">
    <img src="assets/images/no-card.svg" alt="No Projects" class="empty-image mb-4" />
    <div class="text-2xl mb-2">No Projects yet</div>
    <p class="mb-4">
      Create your first project — it will appear here as a card.
    </p>
    <app-button type="normal" label="Create Project" (onClick)="createProject()" />
  </div> -->
</div>
