<app-custom-modal [data]="modalData" (onCancel)="dialogRef.close()" (onClose)="dialogRef.close()" (onSubmit)="submit()"
  [loading]="isLoading" [isFormValid]="form.valid">

  <form [formGroup]="form" class="form">

    <div class="form__grid !gap-y-8 form__grid--quad-col">

      <div class="form__input">
        <label for="projectName" class="form__label">
          Project Name <span class="form__label--required">*</span>
        </label>
        <input type="text" id="projectName" formControlName="projectName">
      </div>

      <div class="form__input">
        <label for="clientName" class="form__label">
          Client Name
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="clientName" formControlName="clientName">
      </div>

      <div class="form__input relative">
        <label for="startDate" class="form__label">
          Start Date
          <!-- <span class="form__label--required">*</span> -->
        </label>

        <input type="text" aria-label="select-patient" matInput class="border rounded-lg p-2 outline-none" readonly
          [matDatepicker]="picker" (click)="picker.open()" formControlName="startDate" id="startDate" />

        <mat-datepicker-toggle matIconSuffix [for]="picker" class="absolute right-0 bottom-0"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </div>

      <div class="form__input relative">
        <label for="endDate" class="form__label">
          End Date
          <!-- <span class="form__label--required">*</span> -->
        </label>

        <input type="text" aria-label="select-patient" matInput class="border rounded-lg p-2 outline-none" readonly
          [matDatepicker]="picker2" (click)="picker2.open()" formControlName="endDate" id="endDate" />

        <mat-datepicker-toggle matIconSuffix [for]="picker2" class="absolute right-0 bottom-0"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </div>
    </div>

    <div class="form__grid form__grid--single-col">
      <div class="form__input">
        <label for="description" class="form__label">
          Project Description
          <!-- <span class="form__label--required">*</span> -->
        </label> <textarea id="description" formControlName="description" name="description" rows="4"
          style="resize: none" class="p-4 w-full border border-gray-300 rounded-lg outline-none"></textarea>
      </div>
    </div>

    <div class="form__grid !gap-y-8 form__grid--double-col">

      <div class="form__input">
        <label for="supplierName" class="form__label">
          Supplier Name
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="supplierName" formControlName="supplierName">
      </div>

      <div class="form__input">
        <label for="supplierGSTNo" class="form__label">
          Supplier GST No.
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="supplierGSTNo" formControlName="supplierGSTNo">
      </div>

      <!-- <div class="form__input">
        <label for="supplierCINNo" class="form__label">
          Supplier CIN No.
        </label>
        <input type="text" id="supplierCINNo" formControlName="supplierCINNo">
      </div> -->

      <!-- <div class="form__input">
        <label for="supplierIECNo" class="form__label">
          Supplier IEC No.
        </label>
        <input type="text" id="supplierIECNo" formControlName="supplierIECNo">
      </div> -->
    </div>

    <div class="form__grid form__grid--single-col">
      <div class="form__input">
        <label for="supplierAddress" class="form__label">
          Supplier Address
          <!-- <span class="form__label--required">*</span> -->
        </label> <textarea id="supplierAddress" formControlName="supplierAddress" name="supplierAddress" rows="4"
          style="resize: none" class="p-4 w-full border border-gray-300 rounded-lg outline-none"></textarea>
      </div>
    </div>

    <div class="form__grid !gap-y-8 form__grid--double-col">

      <div class="form__input">
        <label for="customerName" class="form__label">
          Customer Name
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="customerName" formControlName="customerName">
      </div>

      <div class="form__input">
        <label for="customerGSTNo" class="form__label">
          Customer GST No.
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="customerGSTNo" formControlName="customerGSTNo">
      </div>

      <!-- <div class="form__input">
        <label for="customerCINNo" class="form__label">
          Customer CIN No.
        </label>
        <input type="text" id="customerCINNo" formControlName="customerCINNo">
      </div> -->

      <!-- <div class="form__input">
        <label for="customerIECNo" class="form__label">
          Customer IEC No.
        </label>
        <input type="text" id="customerIECNo" formControlName="customerIECNo">
      </div> -->
    </div>

    <div class="form__grid form__grid--single-col">
      <div class="form__input">
        <label for="customerAddress" class="form__label">
          Customer Address
          <!-- <span class="form__label--required">*</span> -->
        </label> <textarea id="customerAddress" formControlName="customerAddress" name="customerAddress" rows="4"
          style="resize: none" class="p-4 w-full border border-gray-300 rounded-lg outline-none"></textarea>
      </div>
    </div>
  </form>

</app-custom-modal>
