<app-custom-modal [data]="modalData" (onCancel)="dialogRef.close()" (onClose)="dialogRef.close()" (onSubmit)="submit()"
  [loading]="isLoading" [isFormValid]="form.valid">

  <form [formGroup]="form" class="form">

    <div class="form__grid !gap-y-8">

      <div class="form__input">
        <label for="projectName" class="form__label">
          Project Name <span class="form__label--required">*</span>
        </label>
        <input type="text" id="projectName" formControlName="projectName">
      </div>

      <div class="form__input">
        <label for="clientName" class="form__label">
          Client Name
          <!-- <span class="form__label--required">*</span> -->
        </label>
        <input type="text" id="clientName" formControlName="clientName">
      </div>

      <div class="form__input relative">
        <label for="startDate" class="form__label">
          Start Date
          <!-- <span class="form__label--required">*</span> -->
        </label>

        <input type="text" aria-label="select-patient" matInput class="border rounded-lg p-2 outline-none" readonly
          [matDatepicker]="picker" (click)="picker.open()" formControlName="startDate" id="startDate" />

        <mat-datepicker-toggle matIconSuffix [for]="picker" class="absolute right-0 bottom-0"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </div>

      <div class="form__input relative">
        <label for="endDate" class="form__label">
          End Date
          <!-- <span class="form__label--required">*</span> -->
        </label>

        <input type="text" aria-label="select-patient" matInput class="border rounded-lg p-2 outline-none" readonly
          [matDatepicker]="picker2" (click)="picker2.open()" formControlName="endDate" id="endDate" />

        <mat-datepicker-toggle matIconSuffix [for]="picker2" class="absolute right-0 bottom-0"></mat-datepicker-toggle>
        <mat-datepicker #picker2></mat-datepicker>
      </div>
    </div>

    <div class="form__grid form__grid--single-col">
      <div class="form__input mt-4">
        <label for="description" class="form__label">
          Description
          <!-- <span class="form__label--required">*</span> -->
        </label> <textarea id="description" formControlName="description" name="description" rows="5"
          style="resize: none" class="p-4 w-full border border-gray-300 rounded-lg"></textarea>
      </div>
    </div>
  </form>

</app-custom-modal>
