<app-header [data]="headerData" />

<div class="h-screen  bg-slate-100 pb-4">

    <div *ngIf="!isStickerGenerating && !isError" class="h-full overflow-auto">

        <div class="sticky top-0 z-10 bg-transparent p-2 flex justify-end">
            <app-button type="with-icon" label="Download" iconSrc="assets/icons/pdf.svg"
                (onClick)="downloadStickersPdf()" [loading]="isDownloading" />
        </div>

        <!-- This is what jsPDF will capture -->
        <div id="" #printContainer class="py-4 mb-32 h-full overflow-y-auto">

            <!-- One array = one A4 page -->
            <div *ngFor="let pageSticker of pagedStickers; let pageIndex = index" class="sheet"
                [class.page-break]="pageIndex < pagedStickers.length - 1" #sheetRef>

                <!-- Each sticker -->
                <div class="grid grid-cols-4 gap-x-1 gap-y-2">
                    <div *ngFor="let sticker of pageSticker"
                        class="border border-dashed rounded border-green-500 pl-2 pr-1 pb-2 pt-0.5 text-xs">
                        <div class="flex flex-col">
                            <div class="text-[2mm] leading-[2.6mm] font-semibold text-[#008000]">
                                GREENBAY TECH PRIVATE LTD.
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex flex-col gap-0">
                                    <div class="text-[1.9mm] leading-[2.6mm]">PROJECT: {{ sticker.projectName }}</div>
                                    <div class="text-[1.9mm] leading-[2.6mm]">DESC: {{ sticker.description }}</div>
                                    <div class="text-[1.9mm] leading-[2.6mm]">SPEC: {{ sticker.specification }}</div>
                                    <div class="text-[1.9mm] leading-[2.6mm]">SEC: {{ sticker.section }}</div>
                                    <div class="text-[1.9mm] leading-[2.6mm]">SEQ: {{ sticker.seqLabel }}</div>
                                </div>

                                <div class="flex items-center justify-center ml-4">
                                    <qrcode [qrdata]="sticker.qrData" [width]="60" [errorCorrectionLevel]="'M'"
                                        [margin]="2" [elementType]="'canvas'"></qrcode>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <div *ngIf="isStickerGenerating" class="flex items-center justify-center w-full h-96">
        <mat-spinner diameter="70" class="spinner" color="primary" />
    </div>

    <div *ngIf="isError" class="flex justify-center items-center pt-20">
        <span class="text-red-500 font-semibold">Something went wrong. Try Again.</span>
    </div>
</div>
