<app-header [data]="headerData" />
<!-- app-stickers.component.html -->
<div class="h-screen overflow-y-auto bg-slate-100 pb-4">


    <!-- Toolbar (stays at top) -->
    <div class="sticky top-0 z-10 bg-slate-100 p-2 no-print flex justify-end">
        <!-- <button class="px-4 py-2 rounded bg-blue-600 text-white" (click)="downloadStickersPdf()">
            🖨 Download Stickers PDF
        </button> -->
        <app-button type="with-icon" label="Download" iconSrc="assets/icons/pdf.svg"
            (onClick)="downloadStickersPdf()" />
    </div>

    <!-- This is what jsPDF will capture -->
    <div id="" #printContainer class="py-4 space-y-6">

        <!-- One array = one A4 page -->
        <div *ngFor="let pageSticker of pagedStickers; let pageIndex = index"
            class="mx-auto bg-white shadow w-[210mm] min-h-[297mm] p-6 flex flex-col page sheet"
            [class.page-break]="pageIndex < pagedStickers.length - 1" #sheetRef>
            <!-- <div class="font-bold mb-2">
                Page {{ pageIndex + 1 }}
            </div> -->

            <!-- Each sticker -->
            <div class="grid grid-cols-3 gap-x-2 gap-y-4">
                <div *ngFor="let sticker of pageSticker"
                    class="flex justify-between items-center border border-dashed rounded border-green-500 px-3 py-2 text-xs">
                    <div class="">
                        <div class="font-semibold text-sm">{{ sticker.projectName }}</div>
                        <div class="text-[0.65rem]">DESC: {{ sticker.description }}</div>
                        <div class="text-[0.65rem]">SPEC: {{ sticker.specification }}</div>
                        <div class="text-[0.65rem]">SEC: {{ sticker.section }}</div>
                        <div class="text-[0.65rem]">MOC: {{ sticker.moc }}</div>
                        <div class="text-[0.65rem]">QTY: {{ sticker.quantity }}</div>
                    </div>

                    <div class="flex items-center justify-center ml-4">
                        <qrcode [qrdata]="sticker.qrData" [width]="70" [errorCorrectionLevel]="'M'" [margin]="2"
                            [elementType]="'canvas'"></qrcode>
                    </div>
                </div>
            </div>

        </div>

    </div>
</div>
