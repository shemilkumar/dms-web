<app-custom-modal [data]="modalData" (onCancel)="dialogRef.close()" (onClose)="dialogRef.close()" (onSubmit)="submit()"
    [loading]="isLoading">

    <div id="print-container" class="print-container sticker-sheet">
        <div class="sheet">

            <div class="sticker" *ngFor="let sticker of stickers; let i = index">
                <div class="sticker__title">Sticker #{{ i + 1 }}</div>
                <div class="sticker__line">
                    Product: PROD-{{ i + 1 | number: '2.0' }}
                </div>
                <div class="sticker__line">
                    Code: STK-{{ (i + 1) | number: '4.0' }}
                </div>
            </div>
        </div>
    </div>

    <div class="toolbar no-print">
        <button type="button" class="print-btn" (click)="printStickers()">
            🖨 Print Stickers
        </button>
    </div>


</app-custom-modal>
