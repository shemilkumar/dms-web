<div class="min-h-screen flex ">

    <!-- Main content -->
    <div class="flex-1 px-4">
        <app-header [data]="headerData" />

        <main class="p-6 bg-white rounded-xl shadow h-[87.5vh]">

            <div class="flex justify-between items-center mb-4 gap-4">

                <app-search-box placeholder="Search boxes..." />


                <div class="flex justify-end items-center gap-4">
                    <app-button type="add" label="Box" (onClick)="createBox()" />
                </div>

            </div>


            <div class="">

                <ng-container *ngIf="boxes$ | async as boxes">
                    <div *ngIf="boxes.length; else emptyState"
                        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <article *ngFor="let box of boxes"
                            class="bg-green-50 cursor-pointer border rounded-lg shadow-xl hover:bg-white hover:shadow-md hover:border hover:border-green-500 transition p-4 flex flex-col">
                            <div class="flex items-start justify-between gap-3">

                                <div>
                                    <span class="text-lg font-medium text-gray-800">{{ box.boxName }}</span>
                                    <!-- <p class="text-sm text-gray-500 mt-1">{{ b.description || 'No description' }}</p> -->
                                </div>

                                <div class="flex-shrink-0 flex items-center gap-2">
                                    <img src="assets/icons/edit.svg" alt="" class="icon icon__small"
                                        (click)="updateBox(box)">
                                    <img src="assets/icons/delete.svg" alt="" class="icon icon__small">
                                </div>
                            </div>

                            <div class="mt-14 flex items-center justify-between text-sm text-gray-500">
                                <div class="italic font-semibold text-xs text-amber-500">
                                    {{ '12 Nov 2021'}}</div>
                                <div class="text-xs px-2 py-1 bg-green-100 rounded text-gray-500 font-semibold">
                                    {{ 4 }} items
                                </div>
                            </div>
                        </article>
                    </div>
                </ng-container>

                <!-- empty state -->
                <ng-template #emptyState>
                    <div
                        class="border-dashed flex justify-center items-center flex-col border-2 border-gray-200 rounded-lg p-8 text-center text-gray-500">
                        <img src="assets/images/no-card.svg" alt="No Epics" class="empty-image" />
                        <div class="text-2xl mb-2">No boxes yet</div>
                        <p class="mb-4">Create your first box — it will appear here as a card.</p>
                        <app-button type="normal" label="Create Box" (onClick)="createBox()" />
                    </div>
                </ng-template>
            </div>

        </main>
    </div>
</div>
