<!-- Responsive login form (Tailwind) -->
<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
    <div class="w-full max-w-md">
        <div class="bg-white shadow rounded-lg p-6">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-semibold">Sign in to DMS</h2>
                <p class="text-sm text-gray-500 mt-1">Enter your credentials to continue</p>
            </div>

            <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input name="email" ngModel required type="email" autocomplete="username"
                            class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                            placeholder="you@example.com" />
                        <div *ngIf="loginForm.submitted && loginForm.controls?.['email']?.invalid"
                            class="text-xs text-red-500 mt-1">Please enter a valid email.</div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Password</label>
                        <input name="password" ngModel required type="password" autocomplete="current-password"
                            class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
                            placeholder="Password" />
                        <div *ngIf="loginForm.submitted && loginForm.controls?.['password']?.invalid"
                            class="text-xs text-red-500 mt-1">Password is required.</div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="inline-flex items-center text-sm">
                            <input type="checkbox" name="remember" ngModel class="mr-2" />
                            Remember me
                        </label>

                        <a class="text-sm text-indigo-600 hover:underline">Forgot password?</a>
                    </div>

                    <div>
                        <button type="submit" [disabled]="loginForm.invalid || isLoading"
                            class="w-full flex justify-center items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 disabled:opacity-60">
                            <span *ngIf="!isLoading">Sign in</span>
                            <span *ngIf="isLoading">Signing in...</span>
                        </button>
                    </div>
                </div>
            </form>

            <div class="text-center text-sm text-gray-500 mt-4">
                Don't have an account? <a class="text-indigo-600 hover:underline">Sign up</a>
            </div>
        </div>
    </div>
</div>
