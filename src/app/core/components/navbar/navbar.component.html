<header class="sticky top-0 z-50 px-12 pt-4">
    <div class="relative w-full flex items-center justify-between
           rounded-2xl

           bg-white/35 backdrop-blur-2xl backdrop-saturate-150
           border border-white/40
           shadow-[0_8px_30px_rgb(0,0,0,0.06)]

           before:absolute before:inset-0
           before:rounded-2xl
           before:bg-gradient-to-b
           before:from-white/40 before:to-transparent
           before:pointer-events-none
          ">
        <!-- Logo -->
        <div class="flex items-center px-6 py-1 w-80">
            <img src="assets/images/logo.png" alt="Logo" class="w-72" />
        </div>

        <div class="flex gap-8 font-semibold">
            <div class="py-2 px-3 border-b-2 border-green-500">
                Projects
            </div>
            <div class="py-2 px-1">
                User Management
            </div>
        </div>

        <!-- Right icons -->
        <div class="flex justify-end items-center gap-4 px-6 w-80">
            <img src="assets/icons/profile.svg" alt="profile"
                class="profile-icon cursor-pointer transition-transform hover:scale-105" mat-button
                [matMenuTriggerFor]="profileMenu" />

            <mat-menu #profileMenu="matMenu" xPosition="before">
                <button mat-menu-item routerLink="/profile">Profile</button>
                <button mat-menu-item (click)="logout()">Logout</button>
            </mat-menu>
        </div>
    </div>
</header>
