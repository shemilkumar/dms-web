<div class="px-12 py-4 border w-full border-gray-200 bg-gray-100 flex justify-between items-center shadow-md z-50 ">
    <div>
        LOGO
    </div>
    <div>
        <div class="navbar__icons">
            <img src="assets/icons/profile.svg" alt="profile-icon" class="icon cursor-pointer" mat-button
                [matMenuTriggerFor]="profileMenu">
        </div>

        <mat-menu #profileMenu="matMenu" xPosition="before">
            <button mat-menu-item routerLink="/profile">Profile</button>
            <button mat-menu-item (click)="logout()">Logout</button>
        </mat-menu>
    </div>
</div>
