<div class="sidebar-inner relative">
  <!-- Logo / Brand -->
  <div class="logo-row">
    <!-- <div class="logo-mark">
            <span class="logo-initial">L</span>
        </div> -->
    <div class="logo-text">
      <img src="assets/images/logo.png" alt="Logo" class="w-80 cursor-pointer" routerLink="/home" />
      <!-- <div class="logo-subtitle">Inventory Suite</div> -->
    </div>
    <!-- Toggle if you want later
    <div class="toggle-btn" (click)="onToggleClick()">
      <img
        *ngIf="!collapsed"
        src="assets/icons/chevron-left-double.svg"
        alt=""
        class="icon icon__medium"
      />
      <img
        *ngIf="collapsed"
        src="assets/icons/chevron-right-double.svg"
        alt=""
        class="icon icon__medium"
      />
    </div>
    -->
  </div>

  <!-- Navigation -->
  <ul class="nav">
    <div class="nav-list">
      <li *ngFor="let link of navLinks" [routerLink]="link.route" routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
        <!-- optional icon slot if you ever add icons
        <span class="nav-icon">
          <img [src]="link.icon" alt="" *ngIf="link.icon" />
        </span>
        -->
        <span class="nav-label">{{ link.label }}</span>
      </li>
    </div>

    <!-- Optional bottom section (e.g., logout)
    <div class="nav-footer">
      <li class="nav-item nav-item-outlined" (click)="logout()">
        <span class="nav-label">Logout</span>
      </li>
    </div>
    -->
  </ul>
</div>
